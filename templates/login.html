{% extends "base.html" %}
{% block title %}Acceso Profesor — Superfirma{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-112px)] flex items-center justify-center px-4 py-16
            bg-gradient-to-br from-brand-900 via-brand-800 to-brand-700">
  <div class="w-full max-w-sm">

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- Header -->
      <div class="bg-brand-700 px-8 py-7 text-center">
        <div class="w-14 h-14 rounded-full bg-white/15 flex items-center justify-center mx-auto mb-3">
          <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <h1 class="text-white font-bold text-xl">Acceso Profesor</h1>
        <p class="text-white/60 text-sm mt-0.5">Panel de gestión Superfirma</p>
      </div>

      <!-- Form -->
      <form method="post" class="p-8 space-y-5">
        {% if error %}
        <div class="bg-red-50 border border-red-200 rounded-lg px-4 py-3 text-sm text-red-700">
          {{ error }}
        </div>
        {% endif %}

        <div>
          <label for="usuario" class="block text-sm font-semibold text-slate-700 mb-1.5">
            Usuario
          </label>
          <input id="usuario" name="usuario" type="text" required autocomplete="username"
                 placeholder="profesor"
                 class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm
                        focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent
                        placeholder:text-slate-400 transition">
        </div>

        <div>
          <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">
            Contraseña
          </label>
          <input id="password" name="password" type="password" required autocomplete="current-password"
                 placeholder="••••••••"
                 class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm
                        focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent
                        placeholder:text-slate-400 transition">
        </div>

        <button type="submit"
                class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold
                       text-sm py-3 rounded-xl transition focus:outline-none focus:ring-2
                       focus:ring-offset-2 focus:ring-brand-500">
          Entrar al panel
        </button>
      </form>
    </div>

    <p class="text-center text-white/40 text-xs mt-6">
      <a href="{{ url_for('index') }}" class="hover:text-white/70 transition underline">
        Volver a la entrega de alumnos
      </a>
    </p>
  </div>
</div>
{% endblock %}
