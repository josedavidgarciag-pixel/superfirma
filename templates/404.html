{% extends "base.html" %}
{% block title %}Página no encontrada — Superfirma{% endblock %}
{% block content %}
<div class="min-h-[calc(100vh-112px)] flex items-center justify-center px-4">
  <div class="text-center">
    <p class="text-8xl font-extrabold text-brand-200 mb-4">404</p>
    <h1 class="text-2xl font-bold text-slate-700 mb-2">Página no encontrada</h1>
    <p class="text-slate-500 mb-8">El recurso que buscas no existe o fue eliminado.</p>
    <a href="{{ url_for('index') }}"
       class="bg-brand-600 hover:bg-brand-700 text-white font-semibold
              text-sm px-6 py-3 rounded-xl transition">
      Volver al inicio
    </a>
  </div>
</div>
{% endblock %}
